# Generated by scripts/cms_config.py from admin/fields.yml and data/destinations.json. Don't edit by hand.
# Sign in with a GitHub fine-grained token (Contents: read and write on this repo only).
# Every save is a commit; the site redeploys itself.
backend:
  name: github
  repo: blankworker1/travel2sardinia
  branch: main
media_folder: assets/uploads
public_folder: /assets/uploads
collections:
- name: island
  label: Sardinia (island)
  editor:
    preview: false
  files:
  - name: flights
    label: Flight routes
    file: data/flights.json
    format: json
    fields:
    - widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      format: YYYY-MM-DD
      name: updated
      label: Last updated
    - name: note
      widget: hidden
    - name: routes
      label: Routes
      widget: list
      summary: '{{fields.from_city}} → {{fields.to}} · {{fields.airline}}'
      fields:
      - name: id
        label: ID (unique)
        widget: string
      - name: from_city
        label: Origin city / airport (Italian, e.g. Napoli, Milano Linate)
        widget: string
      - name: from_city_en
        label: English name if different (e.g. Naples, Milan Linate)
        widget: string
        required: false
      - name: from_iata
        label: Origin IATA code (e.g. STN)
        widget: string
        pattern:
        - ^[A-Z]{3}$
        - Three capital letters
      - name: country
        label: Country code (e.g. GB)
        widget: string
      - name: lat
        label: Origin latitude
        widget: number
        value_type: float
      - name: lon
        label: Origin longitude
        widget: number
        value_type: float
      - name: to
        label: Arrives at
        widget: select
        options:
        - AHO
        - CAG
        - OLB
      - name: airline
        label: Airline
        widget: string
      - name: flight_no
        label: Flight number if the same for every period (optional)
        widget: string
        required: false
      - name: arr_time
        label: Arrival time if the same for every period (HH:MM, optional)
        widget: string
        required: false
      - name: days_tbc
        label: Days to be confirmed (show the route, marked "days to be confirmed")
        widget: boolean
        default: false
        required: false
      - name: seasons
        label: Operating periods (one per line on the airport's list)
        widget: list
        fields:
        - widget: datetime
          date_format: YYYY-MM-DD
          time_format: false
          format: YYYY-MM-DD
          name: start
          label: From
        - widget: datetime
          date_format: YYYY-MM-DD
          time_format: false
          format: YYYY-MM-DD
          name: end
          label: To
        - name: days
          label: Days of week (1=Mon … 7=Sun, e.g. 1357). Empty = not yet known, period not shown
          widget: string
          required: false
        - name: arr_time
          label: Arrival time in this period (HH:MM)
          widget: string
          required: false
          pattern:
          - ^$|^([01][0-9]|2[0-3]):[0-5][0-9]$
          - Use 24-hour HH:MM, e.g. 07:10
        - name: flight_no
          label: Flight number in this period (e.g. FR753)
          widget: string
          required: false
      - name: admin_note
        label: Admin note (not shown on the site)
        widget: string
        required: false
      - name: sample
        label: Sample entry (shows a 'sample' badge)
        widget: boolean
        default: false
      - name: published
        label: Published
        widget: boolean
        default: true
  - name: holidays
    label: Public holidays
    file: data/holidays.json
    format: json
    fields:
    - name: version
      widget: hidden
      default: 1
    - name: year
      label: Year
      widget: number
      value_type: int
    - widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      format: YYYY-MM-DD
      name: updated
      label: Last updated
    - name: timezone
      widget: hidden
      default: Europe/Rome
    - name: events
      label: Events
      widget: list
      summary: '{{fields.start}} · {{fields.title.it}} ({{fields.status}})'
      fields:
      - name: id
        label: ID (unique, e.g. regnos-altos-2027)
        widget: string
      - name: type
        label: Type
        widget: select
        options:
        - holiday
        - event
        default: event
      - name: scope
        label: Scope
        widget: select
        options:
        - national
        - regional
        - bosa
        default: bosa
      - widget: object
        fields:
        - name: it
          label: Italiano
          widget: string
        - name: en
          label: English
          widget: string
        name: title
        label: Title
      - widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        name: start
        label: Start date (leave empty if unknown)
        required: false
      - widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        name: end
        label: End date
        required: false
      - name: approx
        label: Approximate timing (if no date yet)
        required: false
        widget: object
        fields:
        - name: it
          label: Italiano
          widget: string
        - name: en
          label: English
          widget: string
      - name: status
        label: Status
        widget: select
        options:
        - label: Fixed (confirmed)
          value: fixed
        - label: Pattern (expected from yearly rule)
          value: pattern
        - label: To be confirmed
          value: tbc
        default: tbc
      - name: transport
        label: Transport effect
        widget: select
        required: false
        options:
        - label: Holiday timetables
          value: holiday_timetable
      - name: demand
        label: Accommodation demand
        widget: select
        required: false
        options:
        - normal
        - high
      - name: highlight_days
        label: Main days
        widget: list
        required: false
        field:
          widget: datetime
          date_format: YYYY-MM-DD
          time_format: false
          format: YYYY-MM-DD
          name: day
          label: Day
      - name: organiser
        label: Organiser
        widget: string
        required: false
      - name: url
        label: Website link (shown as a button)
        widget: string
        required: false
        pattern:
        - ^$|^https?://
        - Must start with http:// or https://
      - widget: object
        fields:
        - name: it
          label: Italiano
          widget: string
        - name: en
          label: English
          widget: string
        name: note
        label: Note
        required: false
      - name: published
        label: Published
        widget: boolean
        default: true
  - name: destinations
    label: Destinations
    file: data/destinations.json
    format: json
    fields:
    - name: updated
      label: Last updated
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      format: YYYY-MM-DD
    - name: destinations
      label: Destinations (add new towns with scripts/new_destination.py, then edit them here)
      widget: list
      summary: '{{fields.name.it}} · {{fields.province}}'
      fields:
      - name: id
        label: ID (folder name, don't change)
        widget: string
      - name: name
        label: Name
        widget: object
        fields:
        - name: it
          label: Italiano
          widget: string
        - name: en
          label: English
          widget: string
      - name: province
        label: Province
        widget: string
        required: false
      - name: lat
        label: Latitude
        widget: number
        value_type: float
      - name: lon
        label: Longitude
        widget: number
        value_type: float
      - name: tagline
        label: Short description
        widget: object
        fields:
        - name: it
          label: Italiano
          widget: text
        - name: en
          label: English
          widget: text
      - name: airports
        label: Airports used to reach it
        widget: select
        multiple: true
        options:
        - AHO
        - CAG
        - OLB
      - name: published
        label: Published
        widget: boolean
        default: false
  - name: info
    label: Island tips
    file: data/info.json
    format: json
    fields:
    - widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      format: YYYY-MM-DD
      name: updated
      label: Last updated
    - name: tips
      label: Tips
      widget: list
      summary: '{{fields.title.it}}'
      fields:
      - name: id
        label: ID (unique)
        widget: string
      - name: category
        label: Category
        widget: select
        options:
        - transport
        - travel
        - town
        - safety
      - widget: object
        fields:
        - name: it
          label: Italiano
          widget: string
        - name: en
          label: English
          widget: string
        name: title
        label: Title
      - widget: object
        fields:
        - name: it
          label: Italiano
          widget: text
        - name: en
          label: English
          widget: text
        name: body
        label: Text
      - name: verified
        label: Verified
        widget: boolean
        default: false
      - name: published
        label: Published
        widget: boolean
        default: true
  - name: site
    label: Site settings and links
    file: data/site.json
    format: json
    fields:
    - widget: object
      fields:
      - name: it
        label: Italiano
        widget: string
      - name: en
        label: English
        widget: string
      name: title
      label: Site title
    - widget: object
      fields:
      - name: it
        label: Italiano
        widget: string
      - name: en
        label: English
        widget: string
      name: tagline
      label: Tagline
    - name: links
      label: Links
      widget: object
      fields:
      - name: arst
        label: ARST tickets
        widget: string
      - name: trenitalia
        label: Trenitalia tickets
        widget: string
      - name: aspo
        label: ASPO tickets
        widget: string
      - name: network_contact_url
        label: Contact link for towns that want to join (https://wa.me/… or mailto:)
        widget: string
        required: false
      - name: feedback_url
        label: '"Report an error" link for the island pages (mailto: or https://wa.me/…); empty = network contact'
        widget: string
        required: false
    - name: airports
      label: Airports
      widget: list
      fields:
      - name: code
        widget: string
      - name: name
        widget: string
      - name: short
        label: Short name (used in routes)
        widget: string
        required: false
      - name: color
        label: Map colour (departure cities and routes to this airport use it)
        widget: color
        required: false
      - name: lat
        widget: number
        value_type: float
      - name: lon
        widget: number
        value_type: float
      - name: website
        widget: string
        required: false
      - name: flights_list_url
        label: 'Where to check flights (Alghero/Olbia: ''All flights'' page; Cagliari: live board)'
        widget: string
        required: false
    - name: center
      label: Island map centre
      widget: object
      fields:
      - name: lat
        widget: number
        value_type: float
      - name: lon
        widget: number
        value_type: float
