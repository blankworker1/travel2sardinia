  - name: bosa_stays
    label: 'Bosa: places to stay'
    file: data/destinations/bosa/stays.json
    format: json
    fields:
    - widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      format: YYYY-MM-DD
      name: updated
      label: Last updated
    - name: source_url
      label: Comune's promotion page
      widget: string
      required: false
    - name: stays
      label: Stays
      widget: list
      collapsed: true
      summary: '{{fields.name}} · {{fields.type}} · {{fields.area}}'
      fields:
      - name: id
        label: ID (unique)
        widget: string
      - name: name
        label: Name
        hint: A corrected name is kept when the Comune's list is imported again.
        widget: string
      - name: name_comune
        label: Name on the Comune's list
        widget: hidden
      - name: type
        label: Type
        hint: Imported stays get a type guessed from the name until the Comune's page for that type is imported.
        widget: select
        options:
        - label: Albergo / Hotel
          value: hotel
        - label: Albergo residenziale / Residential hotel
          value: resid_hotel
        - label: Agriturismo / Farm stay
          value: agriturismo
        - label: B&B
          value: bnb
        - label: Casa vacanze (CAV) / Holiday home
          value: cav
        - label: Affittacamere / Guest rooms
          value: affittacamere
        - label: Residence
          value: residence
        - label: Campeggio / Campsite
          value: camping
        - label: Ostello / Hostel
          value: hostel
        - label: Casa per ferie / Holiday house
          value: casa_ferie
        - label: Locazione breve / Short let
          value: short_let
        - label: Boat & breakfast
          value: boat
      - name: area
        label: Area (e.g. Bosa, Bosa Marina, countryside)
        hint: Filled in from the map position; set it here to override.
        widget: string
        required: false
      - name: address
        label: Address
        widget: string
        required: false
      - name: email
        label: Email (for the enquiry button)
        widget: string
        required: false
      - name: website
        label: Website or booking page
        widget: string
        required: false
      - name: lat
        label: Latitude (map position)
        hint: Found automatically from the address. To place a stay by hand, copy the position from a map (e.g. 40.29812)
          and it's kept.
        widget: number
        value_type: float
        required: false
      - name: lon
        label: Longitude (map position)
        widget: number
        value_type: float
        required: false
      - name: source
        label: Source
        hint: '"comune" = imported from the Comune''s promotion page (refreshed on each import). Leave empty for stays added
          by hand.'
        widget: string
        required: false
      - name: url
        label: Hodlstay listing URL
        widget: string
        required: false
      - name: languages
        label: Host languages
        widget: list
        required: false
      - widget: object
        fields:
        - name: it
          label: Italiano
          widget: text
        - name: en
          label: English
          widget: text
        name: notes
        label: Notes
        required: false
      - name: published
        label: Published
        widget: boolean
        default: false
  - name: bosa_taxis
    label: 'Bosa: taxis and transfers'
    file: data/destinations/bosa/taxis.json
    format: json
    fields:
    - widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      format: YYYY-MM-DD
      name: updated
      label: Last updated
    - name: fares
      label: Indicative fares
      widget: list
      collapsed: true
      summary: '{{fields.from.it}} · {{fields.price}}'
      fields:
      - name: from
        label: From
        widget: object
        fields:
        - name: it
          label: Italiano
          widget: string
        - name: en
          label: English
          widget: string
      - name: price
        label: Price (e.g. €80–120)
        widget: string
      - name: time
        label: Time
        widget: object
        fields:
        - name: it
          label: Italiano
          widget: string
        - name: en
          label: English
          widget: string
    - name: note
      label: Note under the fares
      widget: object
      fields:
      - name: it
        label: Italiano
        widget: text
      - name: en
        label: English
        widget: text
    - name: taxis
      label: Taxi and private hire (NCC)
      widget: list
      collapsed: true
      summary: '{{fields.name}} · {{fields.base}} · {{fields.phone}}'
      fields:
      - name: id
        label: ID (unique)
        widget: string
      - name: name
        label: Name
        widget: string
      - name: kind
        label: Type
        widget: select
        options:
        - label: Taxi
          value: taxi
        - label: NCC (noleggio con conducente / private hire)
          value: ncc
      - name: base
        label: Based in (e.g. Bosa, Alghero)
        widget: string
      - name: address
        label: Address
        widget: string
        required: false
      - name: phone
        label: Phone (with +39)
        widget: string
        required: false
      - name: whatsapp
        label: WhatsApp number (with +39), if different
        widget: string
        required: false
      - name: website
        label: Website
        widget: string
        required: false
      - name: email
        label: Email
        widget: string
        required: false
      - name: notes
        label: Notes (e.g. airports served, minibus, card payment)
        widget: object
        required: false
        fields:
        - name: it
          label: Italiano
          widget: text
          required: false
        - name: en
          label: English
          widget: text
          required: false
      - name: verified
        label: Checked (phoned or confirmed by the service)
        widget: boolean
        required: false
      - name: published
        label: Published
        widget: boolean
        default: true
      - name: source
        label: Source (for the coordinator)
        widget: string
        required: false
