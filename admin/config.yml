        required: false
      - name: hodlstay_host_signup_url
        label: Hodlstay host sign-up page
        widget: string
        required: false
      - name: coordinator_contact_url
        label: Coordinator contact link (https://wa.me/… or mailto:)
        widget: string
        required: false
      - name: feedback_url
        label: '"Report an error" link for this town (mailto: or https://wa.me/…); empty = coordinator contact'
        widget: string
        required: false
