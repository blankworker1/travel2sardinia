        options:
        - B&B
        - Apartment
        - Room
        - House
        - Other
      - name: area
        label: Area (e.g. Centro storico, Bosa Marina)
        widget: string
        required: false
      - name: url
        label: Hodlstay listing URL
        widget: string
        required: false
      - name: languages
