<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>travel2sardinia</title>
  <meta name="description" content="Come arrivare nei paesi della Sardegna: voli, autobus e treni, dove dormire, eventi. How to reach Sardinia's towns: flights, buses and trains, where to stay, events.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23c4573a%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <header class="top">
    <div class="brand">
      <h1 id="site-title">travel2sardinia</h1>
      <p id="tagline" class="tagline"></p>
    </div>
    <div class="controls">
      <label class="field"><span data-i18n="from"></span><select id="origin"></select></label>
      <label class="field">
        <span data-i18n="date"></span>
        <span class="date-wrap"><input type="date" id="date"><button type="button" id="clear-date" class="clear" hidden aria-label="Clear date">×</button></span>
      </label>
      <div class="lang" role="group" aria-label="Lingua / Language">
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div id="holiday-banner" class="banner" hidden></div>

  <section class="mapwrap">
    <div id="map" aria-label="Map"></div>
    <div class="mapbtns">
      <button type="button" id="fit-all" data-i18n="map_all"></button>
      <button type="button" id="fit-sardinia" data-i18n="map_sardinia"></button>
    </div>
  </section>

  <main>
    <section id="flights" class="panel">
      <h2 data-i18n="s1_title"></h2>
      <p class="intro" id="flights-intro"></p>
      <div id="flights-body"></div>
    </section>

    <section id="destinations" class="panel">
      <h2 data-i18n="dest_title"></h2>
      <p class="intro" data-i18n="dest_intro"></p>
      <div id="destinations-body"></div>
    </section>

    <section id="events" class="panel">
      <h2 id="year-title"></h2>
      <p class="intro" id="year-intro"></p>
      <div id="events-body"></div>
      <div id="year-body"></div>
    </section>

    <section id="info" class="panel">
      <h2 data-i18n="s5_title"></h2>
      <div id="info-body"></div>
    </section>
  </main>

  <footer>
    <p class="orgs"><span data-i18n="orgs_q_home"></span> <a id="orgs-link" href="organisations/" data-i18n="orgs_link_home"></a></p>
    <p data-i18n="footer_info"></p>
    <p data-i18n="footer_data"></p>
    <p><a href="admin/" class="admin-link">admin</a></p>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
