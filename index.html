<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel to Bosa</title>
  <meta name="description" content="Voli, collegamenti e posti dove dormire a Bosa, Sardegna. Flights, connections and places to stay in Bosa, Sardinia.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23c4573a%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 id="site-title">Travel to Bosa</h1>
      <p id="tagline" class="tagline"></p>
    </div>
    <div class="controls">
      <label class="field">
        <span data-i18n="date">Data</span>
        <input type="date" id="date">
      </label>
      <div class="lang" role="group" aria-label="Lingua / Language">
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div id="holiday-banner" class="banner" hidden></div>

  <section class="mapwrap">
    <div id="map" aria-label="Map"></div>
    <div class="mapbtns">
      <button type="button" id="fit-all" data-i18n="map_all">Tutte le rotte</button>
      <button type="button" id="fit-sardinia" data-i18n="map_sardinia">Sardegna</button>
    </div>
  </section>

  <main>
    <section id="flights" class="panel">
      <div class="panel-head">
        <h2 data-i18n="s1_title"></h2>
        <select id="airport-filter" aria-label="Airport"></select>
      </div>
      <p class="intro" data-i18n="s1_intro"></p>
      <div id="flights-body"></div>
    </section>

    <section id="transfer" class="panel">
      <h2 data-i18n="s2_title"></h2>
      <p class="intro" data-i18n="s2_intro"></p>
      <div class="row">
        <label class="field"><span data-i18n="airport"></span><select id="transfer-airport"></select></label>
        <label class="field"><span data-i18n="arrival_time"></span><input type="time" id="transfer-time" value="12:00"></label>
      </div>
      <div id="transfer-body"></div>
    </section>

    <section id="stays" class="panel">
      <h2 data-i18n="s3_title"></h2>
      <div id="stays-body"></div>
    </section>

    <section id="events" class="panel">
      <h2 data-i18n="s4_title"></h2>
      <div id="events-body"></div>
      <button type="button" id="toggle-calendar" class="link-btn"></button>
      <div id="calendar-body" hidden></div>
    </section>

    <section id="info" class="panel">
      <h2 data-i18n="s5_title"></h2>
      <div id="info-body"></div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer_info"></p>
    <p data-i18n="footer_data"></p>
    <p id="contribute" class="contribute" hidden></p>
    <p><a href="admin/" class="admin-link">admin</a></p>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
