name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update timetables", "Place stays on the map"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cache-bust scripts and styles (each deploy gets new file URLs)
        run: |
          v="${GITHUB_SHA::8}"
          find . -name "*.html" -not -path "./.git/*" -not -path "./admin/*" -not -path "./templates/*" -print0 |
            xargs -0 sed -i -E "s#(app\.js|i18n\.js|style\.css)\"#\1?v=${v}\"#g"
          grep -rho 'app\.js?v=[0-9a-f]*' --include=index.html . | sort -u
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub's Pages service sometimes fails to find the upload for a moment: wait and try again.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 45
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        run: sleep 90
      - id: deployment
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v4
