name: Place stays on the map

on:
  push:
    branches: [main]
    paths: ["data/destinations/*/stays.json", "data/destinations.json"]
  schedule:
    - cron: "41 3 * * 1"   # Mondays, after the timetables
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geocode
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find map positions for new stays (OpenStreetMap)
        run: python scripts/geocode_stays.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/destinations; then
            echo "Nothing new to place."
          else
            git config user.name "travel2sardinia-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/destinations
            git commit -m "Place stays on the map (OpenStreetMap)"
            git pull --rebase -q
            git push
          fi
