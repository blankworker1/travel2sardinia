name: Update timetables

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/transit.json from GTFS feeds
        run: python scripts/build_transit.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/transit.json; then
            echo "No timetable changes."
          else
            git config user.name "travel2sardinia-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/transit.json
            git commit -m "Update timetables from GTFS feeds"
            git push
          fi
